name: Test
on:
  push:
    branches: [develop]
  pull_request:
    branches: [master, develop, next, beta]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # Run the suite on the minimum supported Node, reusing the install above.
      - name: Install Node.js 22.22.2
        run: pnpm runtime set node 22.22.2 -g

      - name: Test (Node 22.22.2)
        run: pnpm test
